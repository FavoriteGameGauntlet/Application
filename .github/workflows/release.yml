name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # the oldest image Tauri supports, so the AppImage runs on older glibc too
          - platform: ubuntu-22.04
            args: '--bundles appimage'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: 'Для установки на Windows скачайте только файл `_x64-setup.exe`, на Linux — только файл `.AppImage`. Остальные не трогайте, они используются для автообновления.'
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
          assetNamePattern: '[name]_[arch][setup][ext]'
